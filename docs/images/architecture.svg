<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="583" viewBox="0 0 900 583">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .section-title { font-size: 13px; font-weight: 700; fill: #334155; }
      .card-title { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .card-title-sm { font-size: 12px; font-weight: 700; fill: #1E293B; }
      .card-sub { font-size: 10.5px; font-weight: 500; fill: #64748B; }
      .badge { font-size: 10px; font-weight: 600; }
      .legend { font-size: 10.5px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <rect width="900" height="583" fill="#FAFBFC"/>

  <!-- ==================== Client Layer ==================== -->
  <g transform="translate(70, 18)">
    <rect width="760" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="760" height="36" rx="16" fill="#EEF2FF"/>
    <rect x="0" y="16" width="760" height="20" fill="#EEF2FF"/>
    <text x="24" y="24" class="font section-title">Client Layer</text>

    <g transform="translate(200, 44)">
      <rect width="160" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="36" rx="2" fill="#6366F1"/>
      <text x="82" y="23" text-anchor="middle" class="font card-title-sm">Web UI</text>
    </g>
    <g transform="translate(400, 44)">
      <rect width="160" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="36" rx="2" fill="#F59E0B"/>
      <text x="82" y="23" text-anchor="middle" class="font card-title-sm">API Clients</text>
    </g>
  </g>

  <!-- HTTP -->
  <path d="M350 108 L350 140 L260 140 L260 180" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="288" y="135" width="34" height="18" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="305" y="148" text-anchor="middle" class="font" style="font-size:10px;fill:#64748B;">HTTP</text>

  <!-- ==================== Control Plane ==================== -->
  <g transform="translate(70, 128)">
    <rect width="760" height="130" rx="16" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="760" height="36" rx="16" fill="#EFF6FF"/>
    <rect x="0" y="16" width="760" height="20" fill="#EFF6FF"/>
    <text x="24" y="24" class="font section-title">Control Plane</text>

    <g transform="translate(15, 52)">
      <rect width="100" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#F97316"/>
      <text x="50" y="26" text-anchor="middle" class="font card-title">UI Server</text>
      <text x="50" y="44" text-anchor="middle" class="font card-sub">Nginx</text>
    </g>
    <g transform="translate(130, 52)">
      <rect width="120" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#10B981"/>
      <text x="60" y="26" text-anchor="middle" class="font card-title">Gateway</text>
      <text x="60" y="44" text-anchor="middle" class="font card-sub">REST API</text>
    </g>
    <g transform="translate(265, 52)">
      <rect width="120" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#2563EB"/>
      <text x="60" y="26" text-anchor="middle" class="font card-title">Server</text>
      <text x="60" y="44" text-anchor="middle" class="font card-sub">HTTPS + SSH</text>
    </g>
    <g transform="translate(400, 52)">
      <rect width="120" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#7C3AED"/>
      <text x="60" y="26" text-anchor="middle" class="font card-title">Controller</text>
      <text x="60" y="44" text-anchor="middle" class="font card-sub">Workload · Domain</text>
    </g>
    <g transform="translate(535, 52)">
      <rect width="210" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#64748B"/>
      <text x="109" y="26" text-anchor="middle" class="font card-title">kcp API Server &amp; DB Syncer</text>
      <text x="109" y="44" text-anchor="middle" class="font card-sub">CRD Storage</text>
    </g>
  </g>

  <!-- ==================== Data Planes ==================== -->
  <g transform="translate(70, 293)">
    <rect width="365" height="225" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="365" height="36" rx="16" fill="#ECFDF5"/>
    <rect x="0" y="16" width="365" height="20" fill="#ECFDF5"/>
    <text x="24" y="24" class="font section-title">GPU Cluster</text>
    <rect x="280" y="12" width="62" height="16" rx="8" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="311" y="24" text-anchor="middle" class="font badge" fill="#059669">Kubernetes</text>

    <g transform="translate(30, 48)">
      <rect width="155" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#14B8A6"/>
      <text x="81" y="25" text-anchor="middle" class="font card-title">Cluster Agent</text>
    </g>
    <g transform="translate(190, 48)">
      <rect width="155" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#0EA5E9"/>
      <text x="81" y="25" text-anchor="middle" class="font card-title">Node Agent</text>
    </g>

    <g transform="translate(30, 148)">
      <rect width="305" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#shadow)"/>
      <text x="14" y="18" class="font card-sub">Pod</text>
      <rect x="30" y="22" width="110" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="85" y="37" text-anchor="middle" class="font card-sub">main</text>
      <rect x="165" y="22" width="110" height="22" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
      <text x="220" y="37" text-anchor="middle" class="font card-sub">networking-sidecar</text>
    </g>

    <path d="M107 88 L107 148" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>
  </g>

  <g transform="translate(465, 293)">
    <rect width="365" height="225" rx="16" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="365" height="36" rx="16" fill="#FFF7ED"/>
    <rect x="0" y="16" width="365" height="20" fill="#FFF7ED"/>
    <text x="24" y="24" class="font section-title">Edge Device</text>
    <rect x="280" y="12" width="48" height="16" rx="8" fill="#FED7AA" stroke="#FDBA74"/>
    <text x="304" y="24" text-anchor="middle" class="font badge" fill="#C2410C">Docker</text>

    <g transform="translate(30, 48)">
      <rect width="155" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#0D9488"/>
      <text x="81" y="25" text-anchor="middle" class="font card-title">Cluster Agent</text>
    </g>
    <g transform="translate(190, 48)">
      <rect width="145" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#0891B2"/>
      <text x="72" y="25" text-anchor="middle" class="font card-title">Node Agent</text>
    </g>

    <g transform="translate(30, 148)">
      <rect width="305" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#shadow)"/>
      <text x="14" y="18" class="font card-sub">Docker Containers</text>
      <rect x="30" y="22" width="110" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="85" y="37" text-anchor="middle" class="font card-sub">main</text>
      <rect x="165" y="22" width="110" height="22" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="220" y="37" text-anchor="middle" class="font card-sub">networking-sidecar</text>
    </g>

    <path d="M107 88 L107 148" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>
  </g>

  <!-- ==================== Connection Lines ==================== -->
  <!-- Blue: WebSocket — Server → Cluster Agents -->
  <path d="M390 242 L390 266 L177 266 L177 341" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>
  <path d="M390 266 L572 266 L572 341" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>

  <!-- Red: SSH Tunnel — Server → Node Agents -->
  <path d="M400 242 L400 279 L337 279 L337 341" stroke="#EF4444" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>
  <path d="M400 279 L727 279 L727 341" stroke="#EF4444" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>

  <!-- Node Agent → Sidecar: Agent bottom=381, Pod top=441 -->
  <path d="M337 381 L337 441" stroke="#EF4444" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>
  <path d="M727 381 L727 441" stroke="#EF4444" stroke-width="1.2" fill="none" stroke-dasharray="6 5"/>

  <!-- Unix Socket: centered between Node Agent(381) and Pod(441) -->
  <rect x="299" y="401" width="76" height="20" rx="10" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="337" y="415" text-anchor="middle" class="font legend" fill="#DC2626">Unix Socket</text>
  <rect x="689" y="401" width="76" height="20" rx="10" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="727" y="415" text-anchor="middle" class="font legend" fill="#DC2626">Unix Socket</text>

  <!-- ==================== Legend ==================== -->
  <g transform="translate(390, 525)">
    <rect width="440" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>

    <line x1="20" y1="12" x2="54" y2="12" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="64" y="16" class="font legend">WebSocket — Resource Sync</text>

    <line x1="20" y1="28" x2="54" y2="28" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="64" y="32" class="font legend">SSH Tunnel — Network Routing</text>

    <rect x="236" y="10" width="72" height="20" rx="10" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="272" y="24" text-anchor="middle" class="font badge" fill="#059669">Kubernetes</text>
    <rect x="316" y="10" width="48" height="20" rx="10" fill="#FED7AA" stroke="#FDBA74"/>
    <text x="340" y="24" text-anchor="middle" class="font badge" fill="#C2410C">Docker</text>
    <rect x="372" y="10" width="48" height="20" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="396" y="24" text-anchor="middle" class="font badge" fill="#7C3AED">Raw</text>
  </g>
</svg>