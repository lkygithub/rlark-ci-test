include:
  - project: 'mizar/ci-templates'
    ref: main
    file: 'base.yml'

variables:
  PROJECT: rlark
  VERSION: v0.1.0
  CI_IMAGE: harbor.infini-ai.com/share/mizar-ci:1.26.5-bookworm
  CI_IMAGE_NODE: harbor.infini-ai.com/share/mizar-ci-node:22-bookworm
  DOCKER_CLIENT_TIMEOUT: "300"
  IMAGE_REGISTRY: harbor.infini-ai.com/share
  BASE_IMAGE: harbor.infini-ai.com/share/ubuntu:22.04
  BASE_IMAGE_UI: harbor.infini-ai.com/share/nginx:1.29.1

.build-go-image:
  image: ${CI_IMAGE}
  services:
    - !reference [.docker-buildx-hostdocker, services]
  stage: build
  needs: []
  tags:
    - mizar-cpu-runner
  before_script:
    - !reference [.golang, prepare_script]
    - !reference [.docker-buildx-hostdocker, prepare_script]
    - !reference [.makefile, prepare_script]
  script:
    - docker login harbor.infini-ai.com --username "$DOCKER_REGISTRY_USER" --password "$DOCKER_REGISTRY_PASS"
    - make IMAGE_TAG=$IMAGE_VERSION docker-push
  after_script:
    - docker image prune -f

.build-ui-image:
  image: ${CI_IMAGE_NODE}
  services:
    - !reference [.docker-buildx-hostdocker, services]
  stage: build
  needs: []
  tags:
    - mizar-cpu-runner
  before_script:
    - !reference [.docker-buildx-hostdocker, prepare_script]
    - !reference [.makefile, prepare_script]
  script:
    - docker login harbor.infini-ai.com --username "$DOCKER_REGISTRY_USER" --password "$DOCKER_REGISTRY_PASS"
    - make IMAGE_TAG=$IMAGE_VERSION docker-push-ui
  after_script:
    - docker image prune -f

build-images-dev:
  extends:
    - .build-go-image
    - .only-default-manual
  variables:
    IMAGE_VERSION: $DEV_VERSION

build-images-rel:
  extends: .build-go-image
  only:
    - tags
  variables:
    IMAGE_VERSION: $REL_VERSION

build-ui-images-dev:
  extends:
    - .build-ui-image
    - .only-default-manual
  variables:
    IMAGE_VERSION: $DEV_VERSION

build-ui-images-rel:
  extends: .build-ui-image
  only:
    - tags
  variables:
    IMAGE_VERSION: $REL_VERSION
