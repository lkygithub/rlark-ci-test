include:
  - project: 'mizar/ci-templates'
    ref: main
    file: 'common.yml'

variables:
  PROJECT: rlark
  VERSION: v0.1.0
  CI_IMAGE: harbor.infini-ai.com/share/mizar-ci:1.26.5-bookworm
  DOCKER_CLIENT_TIMEOUT: "300"
  IMAGE_REGISTRY: harbor.infini-ai.com/share
  BASE_IMAGE: harbor.infini-ai.com/share/ubuntu:22.04
  BASE_IMAGE_UI: harbor.infini-ai.com/share/nginx:1.29.1

build-images-dev:
  image: ${CI_IMAGE}
  services:
    - !reference [.docker-buildx-hostdocker, services]
  stage: build
  needs: []
  tags:
    - mizar-cpu-runner
  extends: .only-default-manual
  parallel:
    matrix:
      - APP:
        - server
        - controller-manager
        - gateway
        - agent
        - ui
        - network-sidecar
  before_script:
    - !reference [.golang, prepare_script]
    - !reference [.docker-buildx-hostdocker, prepare_script]
    - !reference [.makefile, prepare_script]
  script:
    - docker login harbor.infini-ai.com --username "$DOCKER_REGISTRY_USER" --password "$DOCKER_REGISTRY_PASS"
    - make IMAGE_TAG=$DEV_VERSION docker-push-$APP
  after_script:
    - docker image prune -f

build-images-rel:
  image: ${CI_IMAGE}
  services:
    - !reference [.docker-buildx-hostdocker, services]
  stage: build
  needs: []
  tags:
    - mizar-cpu-runner
  only:
    - tags
  parallel:
    matrix:
      - APP:
        - server
        - controller-manager
        - gateway
        - agent
        - ui
        - network-sidecar
  before_script:
    - !reference [.golang, prepare_script]
    - !reference [.docker-buildx-hostdocker, prepare_script]
    - !reference [.makefile, prepare_script]
  script:
    - docker login harbor.infini-ai.com --username "$DOCKER_REGISTRY_USER" --password "$DOCKER_REGISTRY_PASS"
    - make IMAGE_TAG=$REL_VERSION docker-push-$APP
  after_script:
    - docker image prune -f
