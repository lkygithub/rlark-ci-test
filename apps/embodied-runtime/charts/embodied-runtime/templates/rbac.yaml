{{- $name := include "embodied-runtime.devicePluginName" . -}}
{{- $sa := include "embodied-runtime.serviceAccountName" . -}}
{{- $namespace := .Values.namespace -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $namespace }}
  labels:
    {{- include "embodied-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-plugin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "embodied-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-plugin
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "embodied-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-plugin
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
