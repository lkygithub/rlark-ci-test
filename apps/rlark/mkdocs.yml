site_name: RLark
site_url: https://rlark.readthedocs.io/
site_description: Reinforcement Learning Infrastructure for Embodied and Agentic AI
repo_url: https://github.com/RLinf/RLark
edit_uri: edit/main/apps/rlark/docs/
exclude_docs: |
  README.md
  zh/README.md

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy

plugins:
  - search

extra:
  alternate:
    - name: 中文
      link: /zh/
      lang: zh
    - name: English
      link: /
      lang: en

nav:
  - 中文:
    - 概览:
      - RLark 是什么: zh/index.md
      - 核心能力: zh/overview/capabilities.md
      - 核心概念: zh/concepts.md
      - 系统架构: zh/architecture.md
    - 快速开始: zh/quickstart.md
    - 平台使用指南:
      - 使用指南概览: zh/user-guide/index.md
      - 控制台访问与导航: zh/user-guide/console.md
      - 集群与节点: zh/user-guide/clusters-nodes.md
      - 任务: zh/user-guide/jobs.md
      - 工作流: zh/user-guide/workflows.md
      - 存储: zh/user-guide/storage.md
      - SSH Key: zh/user-guide/ssh-keys.md
    - 管理员指南:
      - 管理员指南概览: zh/admin-guide/index.md
      - 生产级控制面部署: zh/admin-guide/control-plane.md
      - 数据面集群接入: zh/admin-guide/data-plane.md
      - Agent 安装与升级: zh/admin-guide/agent.md
      - 节点与资源管理: zh/admin-guide/nodes.md
      - 网络与安全: zh/admin-guide/network-security.md
      - Embodied Runtime 部署: zh/admin-guide/embodied-runtime.md
      - 运维与故障排查: zh/admin-guide/operations.md
      - 完整部署参考: zh/deployment.md
    - 开发者指南:
      - 开发者指南概览: zh/developer-guide/index.md
      - 本地源码运行: zh/developer-guide/local-development.md
      - 项目结构: zh/developer-guide/project-layout.md
      - 技术架构: zh/architecture.md
      - 开发与调试: zh/developer-guide/debugging.md
      - 新设备适配: zh/developer-guide/device-integration.md
      - 贡献指南: zh/developer-guide/contributing.md
    - 参考手册:
      - 参考手册概览: zh/reference/index.md
      - CLI: zh/reference/cli.md
      - API: zh/api/reference.md
      - API 示例: zh/api/examples.md
      - Storage API: zh/storage-api.md
      - CRD: zh/reference/crd.md
      - 配置项: zh/reference/configuration.md
      - Release Notes / Changelog: zh/reference/changelog.md
  - English:
    - Overview:
      - What is RLark: index.md
      - Core Capabilities: overview/capabilities.md
      - Core Concepts: concepts.md
      - System Architecture: architecture.md
    - Quick Start: quickstart.md
    - Platform User Guide:
      - User Guide Overview: user-guide/index.md
      - Console Access and Navigation: user-guide/console.md
      - Clusters and Nodes: user-guide/clusters-nodes.md
      - Jobs: user-guide/jobs.md
      - Workflows: user-guide/workflows.md
      - Storage: user-guide/storage.md
      - SSH Keys: user-guide/ssh-keys.md
    - Administrator Guide:
      - Administrator Guide Overview: admin-guide/index.md
      - Production Control Plane: admin-guide/control-plane.md
      - Data Plane Onboarding: admin-guide/data-plane.md
      - Agent Installation and Upgrade: admin-guide/agent.md
      - Node and Resource Management: admin-guide/nodes.md
      - Networking and Security: admin-guide/network-security.md
      - Embodied Runtime: admin-guide/embodied-runtime.md
      - Operations and Troubleshooting: admin-guide/operations.md
      - Complete Deployment Reference: deployment.md
    - Developer Guide:
      - Developer Guide Overview: developer-guide/index.md
      - Local Development: developer-guide/local-development.md
      - Project Layout: developer-guide/project-layout.md
      - Technical Architecture: architecture.md
      - Development and Debugging: developer-guide/debugging.md
      - New Device Integration: developer-guide/device-integration.md
      - Contributing: developer-guide/contributing.md
    - Reference:
      - Reference Overview: reference/index.md
      - CLI: reference/cli.md
      - API: api/reference.md
      - API Examples: api/examples.md
      - Storage API: storage-api.md
      - CRDs: reference/crd.md
      - Configuration: reference/configuration.md
      - Release Notes / Changelog: reference/changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true
