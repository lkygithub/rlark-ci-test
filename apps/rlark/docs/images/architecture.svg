<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .section-title { font-size: 13px; font-weight: 700; fill: #334155; }
      .card-title { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .card-title-sm { font-size: 12px; font-weight: 700; fill: #1E293B; }
      .card-title-xs { font-size: 11px; font-weight: 700; fill: #1E293B; }
      .card-sub { font-size: 10.5px; font-weight: 600; fill: #475569; }
      .card-sub-sm { font-size: 10px; font-weight: 500; fill: #64748B; }
      .badge { font-size: 10px; font-weight: 600; }
      .badge-xs { font-size: 9px; font-weight: 600; }
      .legend { font-size: 10px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <rect width="960" height="740" fill="#FAFBFC"/>

  <!-- ==================== Client Layer ==================== -->
  <g transform="translate(70, 18)">
    <rect width="820" height="95" rx="16" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" filter="url(#shadow-lg)"/>
