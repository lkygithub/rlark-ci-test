name: Docker Build

on:
  workflow_call:

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server ./cmd/server/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/server/Dockerfile
          push: false
          tags: rlark-server:latest

  build-controller-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/controller-manager ./cmd/controller-manager/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build controller-manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/controller-manager/Dockerfile
          push: false
          tags: rlark-controller-manager:latest

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/gateway ./cmd/gateway/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/gateway/Dockerfile
          push: false
          tags: rlark-gateway:latest

  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/agent ./cmd/agent/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/agent/Dockerfile
          push: false
          tags: rlark-agent:latest

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies and build
        working-directory: web
        run: npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/ui/Dockerfile
          push: false
          tags: rlark-ui:latest

  build-network-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/network-sidecar ./cmd/network-sidecar/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build network-sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/network-sidecar/Dockerfile
          push: false
          tags: rlark-network-sidecar:latest